
name: Build and deploy Python app to Azure Web App - gov-scheme-agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build ChromaDB
        run: |
          python src/ingest.py

      - name: Verify deployment files
        run: |
          test -f streamlit_app.py
          test -f requirements.txt
          test -f data/schemes_clean.csv
          test -d chroma_db
          test -f chroma_db/chroma.sqlite3
          echo "Deployment files verified."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            streamlit_app.py
            requirements.txt
            src/
            data/
            chroma_db/
            !src/__pycache__/
            !data/__pycache__/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B8F43C4E9B104CC3AF45B037287068AC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_39584D0D313044FE9C93DB1865247C4C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FCBBEB949C404E1D804E79C564E8FB68 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: gov-scheme-agent
          slot-name: Production
          package: .
